# Render Blueprint — deploys the BibleWay API (backend npm workspace).
# On render.com: New → Blueprint → pick this repo. Render reads this file,
# creates the service, and prompts once for each `sync: false` secret below
# (copy the values from backend/.env).
services:
  - type: web
    name: bibleway-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # --include=dev: NODE_ENV=production makes npm ci skip devDependencies,
    # but the build needs the repo's own TypeScript (the image's global tsc is
    # newer and rejects our tsconfig).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Not a secret: pin the model in git so prod cannot drift from backend/.env.
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
      - key: CLOUDFLARE_STREAM_CUSTOMER_CODE
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
